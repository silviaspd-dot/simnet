  ],
  "isi": "<h4>Kenapa jaringan perlu dibagi?</h4>\n<p>Bayangkan satu sekolah dengan 500 komputer di <b>satu</b> jaringan besar. Setiap broadcast mengganggu semua komputer, sulit diatur, dan sulit diamankan. Dengan <b>subnetting</b>, satu blok alamat dibagi menjadi beberapa jaringan kecil (misalnya per jurusan atau per VLAN).</p>\n<ul><li>Broadcast terbatas di subnet sendiri, jaringan lebih ringan.</li><li>Mudah diatur dan diamankan per kelompok.</li><li>Alamat IP terpakai efisien.</li></ul>\n<div class=\"tip\"><b>Analogi:</b> Satu kompleks besar dibagi menjadi blok A, B, C, D. Setiap blok punya nomor rumah sendiri dan satpam sendiri.</div>\n<h4>Tiga rumus inti</h4>\n<ul><li><b>Jumlah subnet</b> = 2<sup>n</sup>, n = jumlah bit yang <i>dipinjam</i> dari bagian host.</li><li><b>Jumlah host per subnet</b> = 2<sup>h</sup> − 2, h = jumlah bit host yang tersisa.</li><li><b>Block size</b> = 256 − nilai oktet mask yang berubah. Ini \"lompatan\" dari satu subnet ke subnet berikutnya.</li></ul>\n<h4>Tabel subnet kelas C (/24 dibagi)</h4>\n<table class=\"t\"><tr><th>Prefix</th><th>Mask</th><th>Block size</th><th>Host/subnet</th><th>Subnet dari /24</th></tr>\n<tr><td>/24</td><td>255.255.255.0</td><td>256</td><td>254</td><td>1</td></tr>\n<tr><td>/25</td><td>255.255.255.128</td><td>128</td><td>126</td><td>2</td></tr>\n<tr><td>/26</td><td>255.255.255.192</td><td>64</td><td>62</td><td>4</td></tr>\n<tr><td>/27</td><td>255.255.255.224</td><td>32</td><td>30</td><td>8</td></tr>\n<tr><td>/28</td><td>255.255.255.240</td><td>16</td><td>14</td><td>16</td></tr>\n<tr><td>/29</td><td>255.255.255.248</td><td>8</td><td>6</td><td>32</td></tr>\n<tr><td>/30</td><td>255.255.255.252</td><td>4</td><td>2</td><td>64</td></tr></table>\n<h4>Contoh 1: membagi 192.168.1.0/24 menjadi 4 subnet</h4>\n<ol><li>Butuh 4 subnet → 2<sup>2</sup> = 4, jadi pinjam <b>2 bit</b>.</li><li>Prefix baru: 24 + 2 = <b>/26</b>, mask 255.255.255.192.</li><li>Block size: 256 − 192 = <b>64</b>.</li><li>Host per subnet: 2<sup>6</sup> − 2 = <b>62</b>.</li></ol>\n<table class=\"t\"><tr><th>Subnet</th><th>Alamat jaringan</th><th>Rentang host</th><th>Broadcast</th></tr>\n<tr><td>1</td><td>192.168.1.0/26</td><td>.1 – .62</td><td>192.168.1.63</td></tr>\n<tr><td>2</td><td>192.168.1.64/26</td><td>.65 – .126</td><td>192.168.1.127</td></tr>\n<tr><td>3</td><td>192.168.1.128/26</td><td>.129 – .190</td><td>192.168.1.191</td></tr>\n<tr><td>4</td><td>192.168.1.192/26</td><td>.193 – .254</td><td>192.168.1.255</td></tr></table>\n<h4>Contoh 2: mencari subnet sebuah IP</h4>\n<p>IP <span class=\"mono\">192.168.1.100/26</span>. Block size 64. Kelipatan 64 yang paling dekat tapi tidak melebihi 100 adalah <b>64</b>. Maka: alamat jaringan <b>192.168.1.64</b>, broadcast <b>192.168.1.127</b> (64 + 64 − 1), rentang host .65 sampai .126.</p>\n<h4>Contoh 3: menentukan prefix dari kebutuhan host</h4>\n<table class=\"t\"><tr><th>Butuh host</th><th>Bit host (h)</th><th>Cek 2^h − 2</th><th>Prefix</th></tr><tr><td>10</td><td>4</td><td>14</td><td>/28</td></tr><tr><td>50</td><td>6</td><td>62</td><td>/26</td></tr><tr><td>100</td><td>7</td><td>126</td><td>/25</td></tr><tr><td>2 (link router)</td><td>2</td><td>2</td><td>/30</td></tr></table>\n<p>Rumusnya: cari h terkecil sehingga 2<sup>h</sup> − 2 ≥ kebutuhan, lalu prefix = 32 − h.</p>\n<h4>VLSM: subnet berukuran berbeda</h4>\n<p>Tidak semua bagian butuh jumlah host yang sama. Dengan <b>VLSM</b> (Variable Length Subnet Mask), tiap bagian diberi ukuran sesuai kebutuhan. Mulai dari yang <b>terbesar</b>.</p>\n<table class=\"t\"><tr><th>Kebutuhan</th><th>Prefix</th><th>Subnet</th></tr><tr><td>Lab komputer, 100 host</td><td>/25</td><td>192.168.1.0/25 (.0 – .127)</td></tr><tr><td>Ruang guru, 50 host</td><td>/26</td><td>192.168.1.128/26 (.128 – .191)</td></tr><tr><td>Link antar-router, 2 host</td><td>/30</td><td>192.168.1.192/30 (.192 – .195)</td></tr></table>\n<div class=\"tip\"><b>Kesalahan umum:</b> memakai alamat jaringan atau broadcast sebagai IP perangkat, dan lupa mengurangi 2 saat menghitung host.</div>\n<p>Gunakan <b>kalkulator subnet</b> di bagian Referensi cepat untuk memeriksa hitunganmu.</p>",

  "isi": "<h4>CLI itu apa?</h4><div class=\"tip\"><b>Kenapa dipelajari sekarang?</b> Mulai bab VLAN dan seterusnya, hampir semua konfigurasi memakai CLI. Kuasai dulu dasarnya di sini.</div>\n<p>CLI (Command Line Interface) adalah cara mengatur router atau switch lewat <b>perintah teks</b>. Di simulator, buka perangkat lalu tab CLI.</p>\n<h4>Mode-mode CLI</h4>\n<table class=\"t\"><tr><th>Prompt</th><th>Mode</th><th>Masuk dengan</th></tr><tr><td class=\"mono\">Router&gt;</td><td>User EXEC (hanya melihat)</td><td>awal</td></tr><tr><td class=\"mono\">Router#</td><td>Privileged EXEC</td><td class=\"mono\">enable</td></tr><tr><td class=\"mono\">Router(config)#</td><td>Global configuration</td><td class=\"mono\">configure terminal</td></tr><tr><td class=\"mono\">Router(config-if)#</td><td>Konfigurasi interface</td><td class=\"mono\">interface gi0/0</td></tr></table>\n<p>Kembali satu tingkat dengan <span class=\"mono\">exit</span>, langsung ke mode <span class=\"mono\">#</span> dengan <span class=\"mono\">end</span>.</p>\n<h4>Perintah wajib hafal</h4>\n<table class=\"t\"><tr><th>Perintah</th><th>Fungsi</th></tr><tr><td class=\"mono\">hostname R1</td><td>Mengganti nama perangkat</td></tr><tr><td class=\"mono\">interface gi0/0</td><td>Memilih interface</td></tr><tr><td class=\"mono\">ip address 192.168.1.1 255.255.255.0</td><td>Memberi IP</td></tr><tr><td class=\"mono\">no shutdown</td><td>Menyalakan interface</td></tr><tr><td class=\"mono\">show ip interface brief</td><td>Ringkasan status dan IP semua interface</td></tr><tr><td class=\"mono\">show running-config</td><td>Menampilkan konfigurasi aktif</td></tr><tr><td class=\"mono\">show ip route</td><td>Menampilkan tabel routing</td></tr><tr><td class=\"mono\">show vlan brief</td><td>Menampilkan VLAN (switch)</td></tr><tr><td class=\"mono\">ping 192.168.1.10</td><td>Menguji koneksi</td></tr></table>\n<h4>Trik CLI</h4>\n<ul><li>Tombol <b>Tab</b> melengkapi perintah yang diketik sebagian.</li><li>Tanda <span class=\"mono\">?</span> menampilkan daftar perintah yang tersedia.</li><li>Panah atas mengulang perintah sebelumnya.</li><li>Perintah boleh disingkat selama tidak ambigu, misalnya <span class=\"mono\">conf t</span>.</li><li>Awali dengan <span class=\"mono\">no</span> untuk membatalkan sebuah perintah.</li></ul>\n<div class=\"tip\"><b>Ingat:</b> interface router <b>mati secara default</b>. Hampir semua kasus \"router tidak mau ping\" disebabkan lupa <span class=\"mono\">no shutdown</span>.</div>",

  "isi": "<h4>Default gateway = pintu keluar</h4>\n<p>Kalau tujuan ada di <b>subnet yang sama</b>, PC mengirim langsung. Kalau tujuan ada di <b>subnet lain</b>, PC tidak tahu jalannya, jadi menitipkan paket ke <b>default gateway</b>, yaitu IP router di LAN itu.</p>\n<div class=\"tip\"><b>Analogi:</b> Kamu mengirim surat ke teman satu kompleks: kamu antar langsung. Kalau ke kota lain, surat dititipkan ke kantor pos (gateway).</div>\n<p>Syarat gateway: IP-nya harus <b>satu subnet</b> dengan PC dan merupakan IP interface router yang menghadap LAN itu.</p>\n<h4>Urutan ping, langkah demi langkah</h4>\n<ol><li>PC membandingkan IP tujuan dengan subnet sendiri.</li><li>Satu subnet: kirim langsung. Beda subnet: kirim ke gateway.</li><li><b>ARP</b> bertanya \"siapa pemilik IP ini? kirim alamat MAC-mu!\". Jawabannya disimpan di tabel ARP.</li><li>Switch meneruskan frame berdasarkan alamat MAC (dan VLAN).</li><li>Router membaca IP tujuan, <b>mengurangi TTL</b> satu, mencari rute di tabel routing, lalu meneruskan.</li><li>Tujuan membalas dengan <i>echo reply</i> lewat jalur pulang.</li></ol>\n<p>Karena itu, <b>balasan pertama sering \"Request timed out\"</b>: PC masih sibuk ARP. Ulangi ping, biasanya berhasil.</p>\n<h4>Arti hasil ping</h4>\n<table class=\"t\"><tr><th>Hasil</th><th>Artinya</th><th>Yang dicek</th></tr><tr><td>Reply from…</td><td>Berhasil</td><td>-</td></tr><tr><td>Request timed out</td><td>Tidak ada balasan</td><td>Kabel, IP tujuan, firewall, rute pulang</td></tr><tr><td>Destination host unreachable</td><td>Router/PC tahu tidak ada jalan</td><td>Gateway kosong, rute tidak ada</td></tr></table>\n<h4>TTL</h4>\n<p>TTL (Time To Live) adalah \"umur\" paket. Setiap lewat router, TTL berkurang 1. Bila habis (0), paket dibuang. Ini mencegah paket berputar selamanya.</p>\n<h4>Tracert</h4>\n<p>Perintah <span class=\"mono\">tracert IP</span> menampilkan semua router yang dilewati. Bagus untuk mencari di mana paket berhenti.</p><h4>Alat uji di Command Prompt</h4>\n<table class=\"t\"><tr><th>Perintah</th><th>Fungsi</th><th>Ada di simulator?</th></tr>\n<tr><td class=\"mono\">ipconfig</td><td>Melihat IP, mask, gateway komputer</td><td>Ya</td></tr>\n<tr><td class=\"mono\">ipconfig /all</td><td>Detail lengkap termasuk alamat MAC</td><td>Ya</td></tr>\n<tr><td class=\"mono\">ping IP</td><td>Menguji apakah tujuan dapat dijangkau</td><td>Ya</td></tr>\n<tr><td class=\"mono\">tracert IP</td><td>Menampilkan router yang dilewati</td><td>Ya</td></tr>\n<tr><td class=\"mono\">arp -a</td><td>Melihat tabel ARP (pasangan IP dan MAC)</td><td>Ya</td></tr>\n<tr><td class=\"mono\">hostname</td><td>Menampilkan nama komputer</td><td>Ya</td></tr>\n<tr><td class=\"mono\">nslookup nama</td><td>Mencari IP dari nama domain</td><td>Tidak (di komputer sungguhan)</td></tr>\n<tr><td class=\"mono\">netstat</td><td>Melihat koneksi yang sedang aktif</td><td>Tidak (di komputer sungguhan)</td></tr></table>\n<p>Urutan uji yang disarankan: <b>ipconfig</b> (cek IP sendiri) → <b>ping gateway</b> → <b>ping tujuan</b> → <b>tracert</b> bila gagal.</p>",

  "isi": "<h4>Masalahnya</h4>\n<p>Satu switch dipakai Ruang Guru dan Ruang Siswa. Tanpa VLAN, semua PC satu jaringan: siswa bisa mengintip komputer guru dan <i>broadcast</i> membanjiri semua orang.</p>\n<h4>Solusinya: VLAN</h4>\n<p>VLAN (Virtual LAN) <b>membagi satu switch fisik menjadi beberapa jaringan logis</b>. PC di VLAN 10 tidak bisa mengirim data ke PC di VLAN 20, walau tertancap di switch yang sama.</p>\n<div class=\"tip\"><b>Analogi:</b> Satu gedung kantor disekat menjadi beberapa ruangan. Orang dalam satu ruangan bebas berbicara, tapi tidak bisa langsung bicara dengan ruangan lain.</div>\n<p>Satu VLAN = satu subnet. Contoh: VLAN 10 pakai 192.168.10.0/24, VLAN 20 pakai 192.168.20.0/24.</p>\n<h4>Membuat VLAN lewat CLI</h4>\n<pre class=\"mono small card\" style=\"white-space:pre-wrap;margin:0\">Switch(config)# vlan 10\nSwitch(config-vlan)# name GURU\nSwitch(config-vlan)# exit\nSwitch(config)# interface fa0/1\nSwitch(config-if)# switchport mode access\nSwitch(config-if)# switchport access vlan 10</pre>\n<p>Cek hasilnya dengan <span class=\"mono\">show vlan brief</span>.</p>\n<h4>Port access dan port trunk</h4>\n<table class=\"t\"><tr><th>Jenis</th><th>Membawa</th><th>Disambung ke</th></tr><tr><td>Access</td><td>Satu VLAN</td><td>PC, printer, server</td></tr><tr><td>Trunk</td><td>Banyak VLAN (diberi tag 802.1Q)</td><td>Switch lain atau router</td></tr></table>\n<p>Pada trunk, <b>native VLAN</b> lewat tanpa tag dan harus <b>sama di kedua ujung</b>. <b>Allowed VLAN</b> membatasi VLAN yang boleh lewat.</p>\n<h4>Dua switch, VLAN yang sama</h4>\n<p>VLAN harus <b>dibuat di setiap switch</b>; tidak menyebar otomatis. Lalu sambungkan kedua switch dengan <b>satu kabel trunk</b>. Hasilnya, PC VLAN 10 di switch A bisa ping PC VLAN 10 di switch B.</p>\n<div class=\"tip\"><b>Salah umum:</b> lupa membuat VLAN di switch kedua, native VLAN berbeda, atau allowed VLAN tidak memuat VLAN yang dibutuhkan.</div>",

  "isi": "<h4>Masalah lanjutan</h4>\n<p>VLAN memisahkan jaringan, tapi kadang kita <b>perlu</b> VLAN 10 berbicara dengan VLAN 20 (misalnya guru mengakses file di server siswa). Karena beda subnet, harus lewat <b>router</b>.</p>\n<h4>Satu kabel untuk semua VLAN</h4>\n<p>Menyediakan satu kabel router per VLAN itu boros. Cara hemat: <b>router-on-a-stick</b>. Satu kabel dari router ke switch dijadikan <b>trunk</b>, lalu di router dibuat <b>satu subinterface per VLAN</b>.</p>\n<div class=\"tip\"><b>Analogi:</b> Satu pintu gerbang dengan dua petugas: petugas 1 melayani Ruang Guru, petugas 2 melayani Ruang Siswa. Pintunya satu, tapi tiap ruangan punya petugas sendiri.</div>\n<h4>Langkah konfigurasi</h4>\n<pre class=\"mono small card\" style=\"white-space:pre-wrap;margin:0\">Router(config)# interface gi0/0\nRouter(config-if)# no shutdown\nRouter(config-if)# exit\nRouter(config)# interface gi0/0.10\nRouter(config-subif)# encapsulation dot1q 10\nRouter(config-subif)# ip address 192.168.10.1 255.255.255.0\nRouter(config-subif)# exit\nRouter(config)# interface gi0/0.20\nRouter(config-subif)# encapsulation dot1q 20\nRouter(config-subif)# ip address 192.168.20.1 255.255.255.0</pre>\n<ol><li>Nyalakan interface induk (tanpa IP).</li><li>Buat subinterface: <span class=\"mono\">gi0/0.10</span> untuk VLAN 10, <span class=\"mono\">gi0/0.20</span> untuk VLAN 20.</li><li><b>Urutan penting:</b> <span class=\"mono\">encapsulation dot1q</span> dulu, baru <span class=\"mono\">ip address</span>.</li><li>Port switch ke router dijadikan <b>trunk</b>.</li><li>Isi gateway PC dengan IP subinterface VLAN-nya: PC VLAN 10 → 192.168.10.1, PC VLAN 20 → 192.168.20.1.</li></ol>\n<h4>Checklist kalau gagal</h4>\n<ul><li>Port ke router sudah trunk?</li><li>Interface induk sudah no shutdown?</li><li>Nomor dot1q sama dengan nomor VLAN?</li><li>Gateway PC benar sesuai VLAN-nya?</li></ul>",

  "isi": "<h4>Router dan peta jalan</h4>\n<p>Router punya <b>tabel routing</b>: daftar \"untuk ke jaringan X, lewat sini\". Router otomatis mengenal jaringan yang <b>terhubung langsung</b> (kode <b>C</b> di <span class=\"mono\">show ip route</span>). Jaringan yang jauh harus diajari.</p>\n<h4>Rute statis</h4>\n<p>Rute statis dibuat <b>manual oleh admin</b>. Bentuknya:</p>\n<pre class=\"mono small card\" style=\"white-space:pre-wrap;margin:0\">ip route [jaringan tujuan] [mask] [next hop]\nip route 10.2.2.0 255.255.255.0 172.16.0.2</pre>\n<p>Artinya: \"untuk ke jaringan 10.2.2.0/24, titipkan ke router di 172.16.0.2\". Alamat <b>next hop</b> harus berada di jaringan yang terhubung langsung.</p>\n<div class=\"tip\"><b>Analogi:</b> Kamu memberi petunjuk ke teman: \"Kalau mau ke sekolah, belok kanan di pos ronda lalu lurus.\" Itu rute statis. Tapi dia juga butuh petunjuk pulang!</div>\n<h4>Harus dua arah</h4>\n<p>Ping butuh <b>pergi dan pulang</b>. Jika Router A tahu jalan ke LAN B tetapi Router B tidak tahu jalan balik ke LAN A, balasan hilang dan ping gagal. Selalu buat rute di <b>kedua router</b>.</p>\n<h4>Contoh</h4>\n<table class=\"t\"><tr><th>Router</th><th>Perintah</th></tr><tr><td>Router0 (LAN 10.1.1.0/24)</td><td class=\"mono\">ip route 10.2.2.0 255.255.255.0 172.16.0.2</td></tr><tr><td>Router1 (LAN 10.2.2.0/24)</td><td class=\"mono\">ip route 10.1.1.0 255.255.255.0 172.16.0.1</td></tr></table>\n<p>Cek dengan <span class=\"mono\">show ip route</span>. Rute statis tampil dengan kode <b>S</b>.</p>\n<h4>Rute default: \"kalau tidak tahu, kirim ke sini\"</h4>\n<p>Sebuah router tidak mungkin hafal seluruh jaringan di Internet. Maka dipakai <b>rute default</b>, yaitu rute untuk <i>semua tujuan yang tidak ada di tabel</i>. Ditulis dengan tujuan <span class=\"mono\">0.0.0.0</span> dan mask <span class=\"mono\">0.0.0.0</span>:</p>\n<pre class=\"mono small card\" style=\"white-space:pre-wrap;margin:0\">ip route 0.0.0.0 0.0.0.0 203.0.113.1</pre>\n<p>Artinya: \"untuk tujuan apa pun yang tidak kukenal, titipkan ke 203.0.113.1 (router penyedia Internet)\". Inilah yang membuat jaringan sekolah bisa membuka Internet. Di tabel routing, rute ini berkode <b>S*</b>.</p>\n<h4>Kelebihan dan kekurangan</h4>\n<ul><li>Ringan dan mudah dipahami, cocok untuk jaringan kecil.</li><li>Kalau jaringan bertambah atau berubah, admin harus mengubah manual di semua router.</li></ul>",

  "isi": "<h4>Kenapa perlu routing dinamis?</h4>\n<p>Bayangkan 20 router. Menulis rute statis satu-satu sangat melelahkan dan rawan salah. Pada <b>routing dinamis</b>, router <b>saling bercerita</b> tentang jaringan yang mereka kenal, lalu menyusun tabel sendiri.</p>\n<h4>RIP</h4>\n<p><b>RIP</b> (Routing Information Protocol) memilih jalur dengan <b>hop count</b> (jumlah router yang dilewati). Maksimal 15 hop; 16 dianggap tidak terjangkau. Router mengirim ulang tabelnya tiap 30 detik. Gunakan <b>versi 2</b> karena membawa informasi subnet mask.</p>\n<h4>Konfigurasi dasar</h4>\n<pre class=\"mono small card\" style=\"white-space:pre-wrap;margin:0\">router rip\n version 2\n no auto-summary\n network 10.0.0.0\n network 172.16.0.0\n passive-interface gi0/0</pre>\n<ul><li><b>network:</b> menyebutkan jaringan (alamat berkelas) yang ikut RIP, sekaligus menentukan interface yang aktif berbicara RIP.</li><li><b>no auto-summary:</b> mencegah RIP meringkas jaringan ke batas kelas. Tanpa ini, dua LAN 10.x yang dipisah jaringan lain bisa bertabrakan.</li><li><b>passive-interface:</b> interface ke LAN pengguna tidak perlu mengirim pesan RIP. Jaringannya tetap diumumkan, tetapi tidak mencari tetangga di sana. Lebih aman dan hemat.</li></ul>\n<h4>Membaca hasilnya</h4>\n<p>Pada <span class=\"mono\">show ip route</span>, rute hasil RIP berkode <b>R</b> dan diikuti <span class=\"mono\">[120/1]</span>: 120 adalah <i>administrative distance</i> (tingkat kepercayaan), 1 adalah jumlah hop. Rute statis (distance 1) lebih dipercaya daripada RIP (120).</p>\n<h4>Tabel perbandingan</h4>\n<table class=\"t\"><tr><th></th><th>Statis</th><th>Dinamis (RIP)</th></tr><tr><td>Cara kerja</td><td>Manual</td><td>Otomatis</td></tr><tr><td>Jaringan besar</td><td>Repot</td><td>Cocok</td></tr><tr><td>Beban router</td><td>Ringan</td><td>Ada pesan berkala</td></tr><tr><td>Bila jalur putus</td><td>Tidak berubah sendiri</td><td>Mencari jalur lain</td></tr></table>\n<div class=\"tip\"><b>Cek cepat jika RIP gagal:<   "isi": "<h4>Wi-Fi dan access point</h4>\n<p>Pada jaringan nirkabel, laptop dan HP berkomunikasi lewat <b>gelombang radio</b> dengan <b>access point (AP)</b>. AP yang disambung ke switch lewat kabel straight-through akan menjembatani Wi-Fi ke jaringan kabel.</p>\n<ul><li><b>SSID:</b> nama jaringan Wi-Fi yang muncul di daftar HP, misalnya \"TJKT-WIFI\".</li><li><b>Keamanan:</b> aktifkan <b>WPA2</b> atau <b>WPA3</b> dengan kata sandi kuat. Jangan biarkan Wi-Fi terbuka.</li><li><b>Channel:</b> \"jalur\" frekuensi. AP yang berdekatan sebaiknya memakai channel berbeda supaya tidak saling mengganggu.</li><li><b>Frekuensi:</b> 2,4 GHz lebih jauh jangkauannya tapi lebih ramai. 5 GHz lebih cepat tapi jangkauan lebih pendek.</li></ul>\n<div class=\"tip\"><b>Di simulator:</b> laptop disambung ke access point memakai kabel <b>Nirkabel</b> (dari port Wireless0 laptop ke port AP). Pastikan SSID sama dan IP sudah diisi.</div>\n<h4>Layanan jaringan yang perlu kamu kenal</h4>\n<table class=\"t\"><tr><th>Layanan</th><th>Fungsi</th><th>Contoh</th></tr>\n<tr><td><b>Web server (HTTP)</b></td><td>Menyimpan dan mengirim halaman web</td><td>Membuka alamat 192.168.1.10 dari browser</td></tr>\n<tr><td><b>DHCP</b></td><td>Membagikan IP otomatis ke perangkat</td><td>HP kamu mendapat IP saat tersambung Wi-Fi</td></tr>\n<tr><td><b>DNS</b></td><td>Menerjemahkan nama ke alamat IP</td><td>google.com menjadi 142.250.x.x</td></tr></table>\n<div class=\"tip\"><b>Analogi:</b> DNS itu seperti buku telepon: kita ingat <i>nama</i>, komputer butuh <i>nomor</i>. DHCP itu seperti petugas yang membagikan nomor rumah ke warga baru.</div>\n<h4>Membuat web server di simulator</h4>\n<ol><li>Pasang Server dan PC, sambungkan ke switch dengan kabel straight-through.</li><li>Beri IP statis pada server (contoh 192.168.1.10) dan IP pada PC di subnet yang sama.</li><li>Di Config server, pastikan layanan <b>HTTP</b> menyala, lalu edit isi halamannya.</li><li>Di PC buka <b>Desktop → Web Browser</b>, ketik <span class=\"m  {

  "judul": "Protokol, Nomor Port, dan Jenis Pengiriman",
  "ikon": "🔌",
  "tujuan": [

   "Menyebutkan port dan protokol umum",

  ],
  "isi": "<h4>Protokol: aturan bahasa jaringan</h4>\n<p><b>Protokol</b> adalah aturan yang disepakati supaya dua perangkat saling mengerti. Seperti dua orang harus memakai bahasa yang sama, perangkat dari merek berbeda pun harus memakai protokol yang sama.</p>\n<h4>Nomor port: pintu tiap layanan</h4>\n<p>Alamat IP menunjuk ke sebuah komputer. Tapi di komputer itu ada banyak layanan (web, email, file). <b>Nomor port</b> (0–65535) menentukan layanan mana yang dituju. Penulisannya <span class=\"mono\">IP:port</span>, misalnya <span class=\"mono\">192.168.1.10:80</span>.</p>\n<div class=\"tip\"><b>Analogi:</b> IP = alamat gedung, port = nomor ruangan di dalam gedung.</div>\n<table class=\"t\"><tr><th>Protokol</th><th>Port</th><th>Transport</th><th>Fungsi</th></tr>\n<tr><td>HTTP</td><td>80</td><td>TCP</td><td>Halaman web</td></tr>\n<tr><td>HTTPS</td><td>443</td><td>TCP</td><td>Halaman web terenkripsi</td></tr>\n<tr><td>FTP</td><td>20 / 21</td><td>TCP</td><td>Transfer file</td></tr>\n<tr><td>SSH</td><td>22</td><td>TCP</td><td>Akses jarak jauh terenkripsi</td></tr>\n<tr><td>Telnet</td><td>23</td><td>TCP</td><td>Akses jarak jauh tanpa enkripsi</td></tr>\n<tr><td>SMTP</td><td>25</td><td>TCP</td><td>Mengirim email</td></tr>\n<tr><td>DNS</td><td>53</td><td>UDP/TCP</td><td>Nama ke alamat IP</td></tr>\n<tr><td>DHCP</td><td>67 / 68</td><td>UDP</td><td>Pembagian IP otomatis</td></tr>\n<tr><td>POP3</td><td>110</td><td>TCP</td><td>Mengambil email</td></tr>\n<tr><td>IMAP</td><td>143</td><td>TCP</td><td>Mengambil email (tetap di server)</td></tr>\n<tr><td>SNMP</td><td>161</td><td>UDP</td><td>Memantau perangkat jaringan</td></tr>\n<tr><td>RDP</td><td>3389</td><td>TCP</td><td>Desktop jarak jauh Windows</td></tr></table>\n<h4>TCP dan UDP</h4>\n<ul><li><b>TCP:</b> andal. Sebelum kirim data, kedua pihak \"berjabat tangan\" dulu (<b>three-way handshake</b>): <span class=\"mono\">SYN</span> → <span class=\"mono\">SYN-ACK</span> → <span class=\"mono\">ACK</span>. Data yang hilang dikirim ulang.</li><li><b>UDP:</b> langsung kirim tanpa jabat tangan dan tanpa jaminan. Lebih cepat, cocok untuk video call, game, dan DNS.</li></ul>\n<h4>Tiga jenis pengiriman</h4>\n<table class=\"t\"><tr><th>Jenis</th><th>Tujuan</th><th>Contoh</th></tr><tr><td><b>Unicast</b></td><td>Satu perangkat tertentu</td><td>Ping ke satu PC</td></tr><tr><td><b>Broadcast</b></td><td>Semua perangkat di satu jaringan</td><td>ARP request, DHCP discover</td></tr><tr><td><b>Multicast</b></td><td>Sekelompok perangkat tertentu</td><td>Update routing, siaran video</td></tr></table>\n<h4>Collision domain dan broadcast domain</h4>\n<ul><li><b>Collision domain:</b> area tempat dua sinyal bisa bertabrakan. Hub: seluruh hub satu domain. Switch: <b>setiap port</b> satu domain sendiri, jadi tabrakan hilang.</li><li><b>Broadcast domain:</b> area yang menerima broadcast. Switch <b>tidak</b> memisahkannya. Yang memisahkan: <b>router</b> dan <b>VLAN</b>.</li></ul>",

 {
  "id": "m17",
  "judul": "Keamanan Jaringan Dasar dan Keselamatan Kerja",
  "ikon": "🛡️",
  "tujuan": [
   "Menyebutkan ancaman jaringan yang umum",
   "Menjelaskan tiga prinsip keamanan informasi",
   "Menerapkan langkah pengamanan dasar",
   "Menerapkan keselamatan kerja (K3) saat memasang jaringan"
  ],
  "isi": "<h4>Kenapa jaringan harus diamankan?</h4>\n<p>Jaringan menyimpan data penting: nilai siswa, data pribadi, akun. Jika jaringan tidak aman, data bisa dicuri, diubah, atau layanan dibuat mati.</p>\n<h4>Tiga prinsip keamanan (CIA)</h4>\n<table class=\"t\"><tr><th>Prinsip</th><th>Artinya</th><th>Contoh</th></tr><tr><td><b>Confidentiality</b> (kerahasiaan)</td><td>Hanya yang berhak boleh melihat data</td><td>Password, enkripsi</td></tr><tr><td><b>Integrity</b> (keutuhan)</td><td>Data tidak diubah pihak tak berhak</td><td>Hak akses, tanda tangan digital</td></tr><tr><td><b>Availability</b> (ketersediaan)</td><td>Layanan selalu bisa dipakai</td><td>Cadangan, perangkat redundan</td></tr></table>\n<h4>Ancaman yang sering terjadi</h4>\n<ul><li><b>Malware:</b> virus, worm, ransomware yang merusak atau mengunci data.</li><li><b>Phishing:</b> pesan atau situs palsu untuk mencuri password.</li><li><b>Brute force:</b> menebak password berulang-ulang.</li><li><b>Sniffing:</b> menyadap data yang lewat jaringan, mudah pada jaringan tanpa enkripsi.</li><li><b>DoS/DDoS:</b> membanjiri layanan sampai tidak bisa melayani.</li><li><b>Akses tanpa izin:</b> mencolok kabel atau memakai Wi-Fi tanpa hak.</li></ul>\n<h4>Langkah pengamanan dasar</h4>\n<ol><li><b>Ganti password bawaan</b> perangkat (admin/admin) dengan password kuat: panjang, kombinasi huruf, angka, simbol.</li><li><b>Pakai SSH</b>, bukan Telnet, untuk mengatur perangkat dari jauh.</li><li><b>Amankan Wi-Fi</b> dengan WPA2/WPA3, jangan terbuka.</li><li><b>Matikan port yang tidak dipakai</b> (<span class=\"mono\">shutdown</span>) agar tidak dicolok sembarang orang.</li><li><b>Pisahkan jaringan</b> dengan VLAN: siswa, guru, dan server tidak bercampur.</li><li><b>Firewall:</b> memfilter lalu lintas masuk dan keluar berdasarkan aturan.</li><li><b>Perbarui</b> sistem dan firmware, karena celah lama sering dipakai penyerang.</li><li><b>Cadangkan</b> konfigurasi dan data secara berkala.</li></ol>\n<h4>Istilah penting</h4>\n<ul><li><b>Firewall:</b> penjaga gerbang yang mengizinkan atau memblokir lalu lintas.</li><li><b>ACL</b> (Access Control List): daftar aturan izin/blokir di router.</li><li><b>NAT:</b> menerjemahkan IP privat menjadi IP publik, sehingga banyak PC berbagi satu IP publik.</li><li><b>VPN:</b> terowongan terenkripsi lewat Internet.</li></ul>\n<h4>Etika dan hukum</h4>\n<p>Mengakses jaringan, perangkat, atau akun orang lain <b>tanpa izin</b> adalah pelanggaran dan dapat dikenai sanksi hukum (di Indonesia diatur dalam UU ITE). Berlatihlah hanya di jaringan milik sendiri, lab sekolah, atau simulator, dan selalu minta izin tertulis bila menguji keamanan jaringan orang lain.</p>\n<h4>Keselamatan kerja (K3) saat memasang jaringan</h4>\n<ul><li><b>Listrik:</b> matikan dan cabut daya sebelum memindahkan atau membuka perangkat. Jangan bekerja dengan tangan basah.</li><li><b>Alat tajam:</b> stripper dan pisau kabel dipakai menjauhi badan.</li><li><b>Fiber optik:</b> jangan pernah menatap ujung fiber atau port SFP yang menyala, karena cahaya laser tidak terlihat dan merusak mata.</li><li><b>Ketinggian:</b> pakai tangga yang stabil dan minta teman memegangi saat memasang kabel di plafon atau tembok.</li><li><b>Kabel rapi:</b> jangan biarkan kabel melintang di lantai (orang bisa tersandung). Gunakan <i>cable tray</i>, <i>cable tie</i> atau velcro.</li><li><b>Beri label</b> kedua ujung kabel dan port, agar mudah dilacak.</li><li><b>Hindari tarikan dan tekukan tajam</b> pada kabel, dan jauhkan dari kabel listrik berdaya besar supaya tidak terganggu.</li><li><b>Listrik statis (ESD):</b> sentuh bagian logam berbumi atau pakai gelang antistatik sebelum memegang kartu atau modul.</li><li><b>Rapikan</b> alat dan sisa kabel setelah selesai.</li></ul>",

  if(b.coba&&b.coba.length){h+='<div class="card"><h3>Coba di simulator</h3><p class="small muted">Praktik membuat ilmu menempel. Pilih aktivitas:</p><div class="row">'+b.coba.map(id=>{const a=ACTS.find(x=>x.id===id);return a?'<button class="btn sm pri" data-act="mcoba" data-id="'+id+'">▶ '+esc(a.title)+'</button>':''}).join('')+'</div></div>'}

function calcHTML(){
  const c=UI.calc,ipn=ip2n(c.ip),p=parseInt(c.p);
  if(ipn===null||!(p>=0&&p<=32))return '<span class="muted small">Masukkan IP yang valid dan prefix 0 sampai 32.</span>';
  const mask=p===0?0:((0xFFFFFFFF<<(32-p))>>>0),net=(ipn&mask)>>>0,bc=(net|((~mask)>>>0))>>>0;
  const hosts=p===32?1:p===31?2:Math.pow(2,32-p)-2,first=p>=31?net:net+1,last=p>=31?bc:bc-1,o=ipn>>>24;
  const priv=(o===10)||(ipn>>>20)===0xAC1||(ipn>>>16)===0xC0A8;
  const rows=[['Subnet mask',n2ip(mask)],['Alamat jaringan',n2ip(net)+'/'+p],['Broadcast',n2ip(bc)],['Host pertama',n2ip(first)],['Host terakhir',n2ip(last)],['Jumlah host',hosts.toLocaleString('id-ID')],['Jenis',priv?'IP privat (dipakai di LAN)':'IP publik']];
  return '<table class="t">'+rows.map(r=>'<tr><th>'+r[0]+'</th><td class="mono">'+r[1]+'</td></tr>').join('')+'</table>';
}
function drawCalc(){const el=$('#calc-out');if(el)el.innerHTML=calcHTML()}
PCH.calc=el=>{UI.calc[el.dataset.k]=el.value;drawCalc()};

function evalAses(ctx){
  const T=asesItems(ctx.paket,ctx),groups=[];let total=0;
  T.nama=T.nama||[];
  for(const[key,label,max]of AS_GROUPS){
    let items;
    if(key==='bukti'){
      const n=ctx.tests.length,s=ctx.tests.filter(t=>t.ok).length;
      items=[{t:'Minimal tiga pengujian tercatat, dua berhasil',w:1,f:0.5*clip(n/3)+0.5*clip(s/2)}];
    }else items=(T[key]||[]).map(i=>({t:i.t,w:i.w,f:(()=>{try{const v=i.f();return typeof v==='number'?clip(v):(v?1:0)}catch(e){return 0}})()}));
    const sw=items.reduce((a,b)=>a+b.w,0)||1;
    const earned=items.reduce((a,b)=>a+max*(b.w/sw)*b.f,0);
    groups.push({key,label,max,earned,items});total+=earned;
  }
  return{groups,total,max:70};
}

  if(String(i.nama).trim().length<3)return 'Isi nama lengkap (minimal 3 huruf).';
  if(!String(i.kelas).trim())return 'Isi kelas, misalnya X TJKT 1.';
  if(GP.reqNIS&&String(i.nis).trim().length<4)return 'Isi NIS.';
  if(!(a>=1&&a<=99))return 'Nomor absen harus antara 1 dan 99.';
  if(!(d>=10&&d<=300))return 'Durasi harus antara 10 dan 300 menit.';
  if(GP.tanggal&&asTodayStr()<GP.tanggal)return 'Asesmen ini dijadwalkan pada '+asTglFmt(GP.tanggal)+'. Belum bisa dimulai.';

async function getDownloads(){try{return(window.claude&&claude.use)?await claude.use('downloads'):null}catch(e){return null}}
function nativeSave(name,data,mime){
  const blob=new Blob([data],{type:mime});
  if(navigator.msSaveBlob){navigator.msSaveBlob(blob,name);return true}
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000);
  return true;
}
async function asSave(kind){

  const dl=await getDownloads();
  try{
    if(dl)await dl.save({filename:name,data});
    else nativeSave(name,data,kind==='pdf'?'application/pdf':'application/json');
    AS.saved[kind]=true;AS.dlmsg=(AS.saved.pdf&&AS.saved.json)?'Kedua berkas sudah disimpan. Unggah ke Google Classroom.':'Berkas disimpan. Simpan juga berkas yang satunya lagi.';

    else{
      try{nativeSave(name,data,kind==='pdf'?'application/pdf':'application/json');AS.saved[kind]=true;saveAses();AS.dlmsg='Berkas disimpan.'}

}

PCH.gp=el=>{
  const k=el.dataset.k;if(!(k in GP_DEF)||k==='pin')return;
  if(el.type==='checkbox')GP[k]=el.checked;
  else if(typeof GP_DEF[k]==='number'){
    const v=parseInt(el.value);if(!(v>=0))return;
    GP[k]=k==='durasi'?clamp(v,10,300):(k==='maxCek'?clamp(v,0,10):v);
  }else if(k==='tanggal')GP[k]=/^\d{4}-\d{2}-\d{2}$/.test(el.value)?el.value:'';
  else GP[k]=String(el.value).slice(0,k==='aturan'?1500:60);
  saveGP();
  if(k==='allowCopy')applyRole();
};
function gpDialog(){

    }else if(g==='gpimp'){
      const err=$('#gp-err');let o;
      try{o=JSON.parse($('#gp-json').value)}catch(x){err.textContent='Teks bukan JSON yang valid.';return}
      if(!o||typeof o!=='object'){err.textContent='Isi pengaturan tidak sesuai.';return}
      for(const k of Object.keys(GP_DEF))if(k!=='pin'&&o[k]!=null&&typeof o[k]===typeof GP_DEF[k])GP[k]=o[k];

function topoSVG(snapStr){
  let o;try{o=JSON.parse(snapStr)}catch(e){return '<p class="small muted">Belum ada data jaringan.</p>'}
  const dv=o.devices||[];if(!dv.length)return '<p class="small muted">Kanvas siswa masih kosong.</p>';
  let a=1e9,b=-1e9,c=1e9,d=-1e9;for(const x of dv){a=Math.min(a,x.x);b=Math.max(b,x.x);c=Math.min(c,x.y);d=Math.max(d,x.y)}
  const W=560,H=250,sc=Math.min((W-110)/Math.max(1,b-a),(H-70)/Math.max(1,d-c),1.4),ox=W/2-((a+b)/2)*sc,oy=H/2-((c+d)/2)*sc;
  const P=id=>{const x=dv.find(q=>q.id===id);return x?[ox+x.x*sc,oy+x.y*sc]:[0,0]};
  const col={straight:'#2a6bdb',cross:'#d9731a',console:'#0e98a8',fiber:'#b58500',wifi:'#7a5ad0'};
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:100%;height:auto;background:var(--stage);border:1px solid var(--line);border-radius:8px" role="img" aria-label="Topologi siswa">';
  for(const l of o.links||[]){const p=P(l.a.dev),q=P(l.b.dev);s+='<line x1="'+p[0]+'" y1="'+p[1]+'" x2="'+q[0]+'" y2="'+q[1]+'" stroke="'+(l.plugged===false?'#8a95a4':col[l.cable]||'#888')+'" stroke-width="2"'+((l.plugged===false||l.cable==='wifi'||l.cable==='console')?' stroke-dasharray="3 4"':'')+'/>'}
  for(const x of dv){const p=P(x.id);const ab={pc:'PC',laptop:'LP',server:'SV',printer:'PR',switch:'SW',router:'RT',ap:'AP'}[x.type]||'?';
    s+='<rect x="'+(p[0]-17)+'" y="'+(p[1]-11)+'" width="34" height="22" rx="4" fill="var(--surface)" stroke="var(--ink)"/><text x="'+p[0]+'" y="'+(p[1]+4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)">'+ab+'</text><text x="'+p[0]+'" y="'+(p[1]+25)+'" text-anchor="middle" font-size="9" fill="var(--ink)">'+esc(x.name)+'</text>'}
  return s+'</svg>';
}

const PTCAB={straight:'Copper Straight-Through',cross:'Copper Cross-Over',console:'Console',fiber:'Fiber',wifi:'Nirkabel (tanpa kabel: laptop memilih SSID access point)'};
function ptPort(d,pn){
  if(pn==='RS232')return 'RS 232';
  if(d.type==='ap'){if(pn==='Port0')return 'Port 0';if(pn==='Wireless0')return 'Port 1 (nirkabel)'}

const hostName=n=>String(n).replace(/[^A-Za-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'')||'Perangkat';
function iosCfg(d){
  const o=['enable','configure terminal','hostname '+hostName(d.name)];
  const blk=(h,lines)=>{if(lines.length)o.push(h,...lines.map(l=>' '+l),' exit')};
  if(d.type==='switch'){
    for(const k of Object.keys(d.vlans).map(Number).sort((a,b)=>a-b))if(k!==1)blk('vlan '+k,['name '+String(d.vlans[k]).replace(/\s+/g,'_')]);
    for(const p of d.ports){
      const f=d.ifaces[p.n];if(!f)continue;const L=[];
      if(f.desc)L.push('description '+String(f.desc).replace(/\s+/g,'_'));
      if(f.mode==='trunk'){L.push('switchport mode trunk');if((f.native||1)!==1)L.push('switchport trunk native vlan '+f.native);if(f.allowed)L.push('switchport trunk allowed vlan '+allowedText(f))}
      else if(f.vlan!==1)L.push('switchport mode access','switchport access vlan '+f.vlan);
      if(f.shut)L.push('shutdown');
      blk('interface '+p.n,L);
    }
    if(ip2n(d.svi.ip)!==null&&maskOK(d.svi.mask))blk('interface vlan 1',['ip address '+d.svi.ip+' '+d.svi.mask,d.svi.shut?'shutdown':'no shutdown']);
    if(ip2n(d.gw)!==null)o.push('ip default-gateway '+d.gw);
  }else if(d.type==='router'){
    for(const p of d.ports){
      const f=d.ifaces[p.n];if(!f)continue;const L=[];
      if(f.desc)L.push('description '+String(f.desc).replace(/\s+/g,'_'));
      if(ip2n(f.ip)!==null&&maskOK(f.mask))L.push('ip address '+f.ip+' '+f.mask);
      if(!f.shut)L.push('no shutdown');
      blk('interface '+p.n,L);
    }
    for(const k of Object.keys(d.subs||{}).sort()){
      const q=d.subs[k],L=[];
      if(q.vlan)L.push('encapsulation dot1Q '+q.vlan);
      if(ip2n(q.ip)!==null&&maskOK(q.mask))L.push('ip address '+q.ip+' '+q.mask);
      if(q.shut)L.push('shutdown');
      blk('interface '+k,L.length?L:['no shutdown']);
    }
    if(d.rip&&d.rip.on){
      const L=['version '+d.rip.version];
      for(const n of d.rip.networks)L.push('network '+n);
      for(const n of d.rip.passive||[])L.push('passive-interface '+n);
      if(d.rip.autoSum===false&&d.rip.version===2)L.push('no auto-summary');
      blk('router rip',L);
    }
    for(const r of d.routes)o.push('ip route '+r.net+' '+r.mask+' '+r.via);
  }else return null;
  o.push('end','write memory');
  return o;
}
function ptPackage(name){
  const D=S.devices,Lk=S.links,t=[];
  const row=(a,w)=>a.map((x,i)=>String(x==null?'':x).padEnd(w[i])).join('  ').replace(/\s+$/,'');
  const nm=id=>dev(id).name;
  t.push('PAKET RANCANGAN JARINGAN UNTUK CISCO PACKET TRACER','Proyek   : '+name,'Dibuat   : '+new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta'})+' (SIMNET)','Isi      : '+D.length+' perangkat, '+Lk.length+' kabel','');
  t.push('CATATAN','- Berkas .pkt asli tidak dapat dibuat oleh aplikasi web, jadi paket ini berisi semua yang dibutuhkan untuk membangun ulang rancangan di Packet Tracer dalam beberapa menit.','- Packet Tracer menyimpan konfigurasi sebagai ekstensi .pkt. Setelah selesai membangun, simpan dengan File > Save.','');
  t.push('LANGKAH','1. Buka Packet Tracer, lalu tambahkan perangkat sesuai tabel PERANGKAT (model tertera di kolom Model PT). Ubah nama (Display Name) agar sama.','2. Pasang kabel sesuai tabel KABEL. Pilih jenis kabel dan port persis seperti tertera.','3. Klik PC/Laptop/Server > Desktop > IP Configuration, isi sesuai tabel ALAMAT IP HOST. Server: Services > HTTP.','4. Klik switch/router > tab CLI. Jika muncul pertanyaan "Continue with configuration dialog? [yes/no]", ketik no lalu Enter, tunggu sampai muncul prompt Router> atau Switch> (tekan Enter bila perlu). Baru tempel skrip dari bagian SKRIP CLI perangkat itu (satu perangkat satu skrip).','5. Uji dengan ping (Simulation atau Command Prompt) dan periksa lampu link.','');
  const w1=[Math.max(10,...D.map(d=>d.name.length))+0,30,16];
  t.push('PERANGKAT',row([tr('Nama'),'Model PT',tr('Posisi (x,y)')],w1),row(['----','--------','------------'],w1));
  for(const d of D)t.push(row([d.name,PTMODEL[d.type],Math.round(d.x)+','+Math.round(d.y)],w1)+(d.power?'':'   (dimatikan)'));
  t.push('','KABEL');
  const rows=Lk.map(l=>{const a=dev(l.a.dev),b=dev(l.b.dev);return[a.name,ptPort(a,l.a.port),b.name,ptPort(b,l.b.port),PTCAB[l.cable]+(l.plugged===false?' (dicabut)':'')]});
  const w2=[0,1,2,3].map(i=>Math.max(8,...rows.map(r=>String(r[i]).length)))
  t.push(row([tr('Dari'),'Port',tr('Ke'),'Port',tr('Jenis kabel')],w2.concat([0])),row(['----','----','--','----','-----------'],w2.concat([0])));
  if(!rows.length)t.push('(belum ada kabel)');
  for(const r of rows)t.push(row(r,w2.concat([0])));
  const hs=D.filter(d=>isHost(d.type));
  t.push('','ALAMAT IP HOST (Desktop > IP Configuration)');
  if(!hs.length)t.push('(tidak ada PC/laptop/server/printer)');
  else{const w3=[Math.max(8,...hs.map(d=>d.name.length)),16,16,16,16];t.push(row([tr('Nama'),'IP address','Subnet mask','Gateway','DNS'],w3),row(['----','----------','-----------','-------','---'],w3));for(const d of hs)t.push(row([d.name,d.host.ip||'-',d.host.mask||'-',d.host.gw||'-',d.host.dns||'-'],w3))}
  const sv=D.filter(d=>d.type==='server'&&d.http);
  if(sv.length){t.push('','LAYANAN WEB SERVER (Services > HTTP)');for(const d of sv)t.push(d.name+': HTTP '+(d.http.on?'On':'Off')+'. Isi halaman (index.html): '+String(d.http.page).replace(/\s*\n\s*/g,' '))}
  const aps=D.filter(d=>d.type==='ap');
  if(aps.length){t.push('','ACCESS POINT (Config > Port 1 > SSID)');for(const d of aps)t.push(d.name+': SSID '+d.ssid)}
  const lp=D.filter(d=>d.type==='laptop');
  if(lp.length)t.push('','CATATAN LAPTOP: bila port yang dibutuhkan tidak ada (FastEthernet0 untuk kabel atau Wireless0 untuk Wi-Fi), matikan laptop, lalu ganti modul: PT-LAPTOP-NM-1CFE (kabel) atau PT-LAPTOP-NM-1W (nirkabel).');
  if(D.some(d=>d.type!=='pc'&&Lk.some(l=>l.cable==='fiber'&&(l.a.dev===d.id||l.b.dev===d.id))))t.push('','CATATAN FIBER: pada model 2960-24TT dan 2911 port Gi0/2 berupa tembaga. Untuk fiber sungguhan tambahkan modul SFP/fiber yang sesuai.');
  let any=false;
  for(const d of D){
    const c=iosCfg(d);if(!c)continue;
    if(!any){t.push('','SKRIP CLI (tempel di tab CLI masing-masing perangkat)');any=true}
    t.push('','!------- '+d.name+' ('+PTMODEL[d.type]+') -------',...c);
  }
  if(!any)t.push('','(tidak ada switch atau router, jadi tidak ada skrip CLI)');
  t.push('','!------- akhir paket -------');
  return tr(t.join('\r\n'));
}

function p3up(e){

  if(V3.ptrs.size<2)V3.pinch=null;
  const dd=V3.drag;if(!dd||dd.id!==e.pointerId)return;V3.drag=null;
  if(dd.moved){if(dd.kind==='dev')afterChange();return}
  tap(dd,e.clientX,e.clientY);
}
/* ---------- animasi paket ---------- */
function animate3D(ids,ok){
  if(!V3.ok)return;
  const pts=ids.map(i=>dev(i)).filter(Boolean).map(d=>new THREE.Vector3(d.x/U3,0.9,d.y/U3));
  disposeGroup(V3.fx);V3.anim=null;
  if(pts.length<2)return;
  const ball=new THREE.Mesh(new THREE.SphereGeometry(0.28,16,16),new THREE.MeshBasicMaterial({color:new THREE.Color(ok?cssv('--good'):cssv('--accent'))}));
  V3.fx.add(ball);
  const segs=[];let total=0;for(let i=1;i<pts.length;i++){const l=pts[i].distanceTo(pts[i-1]);segs.push(l);total+=l}
  const t0=performance.now(),speed=7;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step=now=>{
    const dist=reduce?total:Math.min(total,(now-t0)/1000*speed);let acc=0;
    for(let i=0;i<segs.length;i++){if(dist<=acc+segs[i]||i===segs.length-1){const f=segs[i]?Math.min(1,(dist-acc)/segs[i]):1;ball.position.copy(pts[i]).lerp(pts[i+1],f);break}acc+=segs[i]}
    V3.dirty=true;
    if(dist<total){V3.anim=requestAnimationFrame(step)}else{V3.anim=null;setTimeout(()=>{disposeGroup(V3.fx);V3.dirty=true},1200)}
  };
  V3.anim=requestAnimationFrame(step);
}
/* ================= INISIALISASI ================= */
function boot(){
  buildPalette();bindCanvas();bindModal();bindGlobal();bindPanelExtras();
  loadProfile();
  let loaded=false;
  try{loaded=loadLocal()}catch(e){}
  if(!loaded||!S.devices.length){loadTemplate('lan',true)}
  if(typeof asesInit==='function')asesInit();
  if(typeof cbtInit==='function')cbtInit();
  markTabs();markPalette();setTool('select');
  afterChange();
  requestAnimationFrame(()=>requestAnimationFrame(fitView));
  window.addEventListener('resize',()=>{if(UI.view==='2d')render2D()});
}
boot();
</script>

njadi 10 saja, lalu ping VLAN 20 gagal.": "Try changing allowed VLANs to 10 only, then the VLAN 20 ping fails.", "Colok kembali": "Plug back in", "Console (rollover): untuk konfigurasi lewat terminal. Satu ujung ke RS232 komputer, ujung lain ke port Console switch atau router.": "Console (rollover): for configuration via terminal. One end to the computer's RS232, the other to the switch or router Console port.", "Contoh: 192.168.1.10/24 → jaringan 192.168.1.0, host 1 sampai 254. IP di subnet berbeda hanya bisa berkomunikasi lewat router.": "Example: 192.168.1.10/24 → network 192.168.1.0, hosts 1 to 254. IPs in different subnets can only communicate through a router.", "Contoh: Router0 Gi0/0 10.1.1.1, Gi0/1 172.16.0.1/30 (mask 255.255.255.252). Router1 Gi0/0 172.16.0.2, Gi0/1 172.16.0.5. Router2 Gi0/1 172.16.0.6, Gi0/0 10.2.2.1. PC: IP dan gateway LAN-nya.": "Example: Router0 Gi0/0 10.1.1.1, Gi0/1 172.16.0.1/30 (mask 255.255.255.252). Router1 Gi0/0 172.16.0.2, Gi0/1 172.16.0.5. Router2 Gi0/1 172.16.0.6, Gi0/0 10.2.2.1. PCs: IP and the gateway of their LAN.", "Crossover: pasangan kirim dan terima ditukar. Dipakai untuk perangkat sejenis, misalnya PC ke PC, switch ke switch, router ke router.": "Crossover: the transmit and receive pairs are swapped. Used for like devices, e.g. PC to PC, switch to switch, router to router.", "Daftar kabel": "Cable list", "Daftar perangkat dan model, kabel dan port, tabel IP, serta skrip CLI siap tempel. Aplikasi web tidak dapat membuat berkas .pkt asli, jadi rancangan dibangun ulang di Packet Tracer mengikuti paket ini.": "List of devices and models, cables and ports, IP table, and ready-to-paste CLI scripts. A web app cannot create a real .pkt file, so rebuild the design in Packet Tracer following this package.", "Dari": "From", "dari 70 (otomatis)": "of 70 (automatic)", "dari port": "from port", "Data di bawah mungkin tidak terbaru.": "The data below may not be up to date.", "Data peserta tidak ditemukan.": "Participant data not found.", "daya menyala, kabel terpasang, lampu link hijau, jenis kabel benar.": "power on, cable connected, link light green, correct cable type.", "default gateway belum diisi": "default gateway not filled in", "dengan kunci rahasia panjang (minimal 16 karakter), lalu tekan Run. Harus muncul": "with a long secret key (at least 16 characters), then press Run. You should see", "Di CLI Router0 ketik show ip route, cari baris R. Lalu kirim PDU PC0 ke PC1.": "In Router0's CLI type show ip route and look for the R lines. Then send a PDU from PC0 to PC1.", "di index.html dengan baris ini:": "in index.html with this line:", "di jaringan ini.": "in this network.", "di Pengaturan untuk meniru itu.": "in Settings to imitate it.", "di repositori GitHub tekan": "in the GitHub repository press", "Di terminal: interface vlan 1, ip address 192.168.1.2 255.255.255.0, no shutdown, lalu end.": "In the terminal: interface vlan 1, ip address 192.168.1.2 255.255.255.0, no shutdown, then end.", "Di tiap switch, tab Konfigurasi: tambah VLAN 10 dan 20. Fa0/1 ke VLAN 10, Fa0/2 ke VLAN 20.": "On each switch, Config tab: add VLAN 10 and 20. Fa0/1 to VLAN 10, Fa0/2 to VLAN 20.", "Dinilai guru (30 poin). Tersimpan otomatis.": "Graded by the teacher (30 points). Saved automatically.", "ditentukan dari nomor absen": "determined by attendance number", "Dokumentasi dan perbaikan": "Documentation and fixes", "Dokumentasi dan refleksi": "Documentation and reflection", "Dokumentasi: kesimpulan dan refleksi": "Documentation: conclusion and reflection", "Dua Gedung dengan Router": "Two Buildings with a Router", "Dua jaringan dengan router": "Two networks with a router", "Dua kantor cabang dihubungkan lewat router pusat. Rute antar-kantor tidak boleh ditulis manual. Semua router harus belajar rute dengan RIP.": "Two branch offices are connected through a central router. Inter-office routes must not be written manually. All routers must learn routes with RIP.", "Dua LAN dengan router": "Two LANs with a router" dmin saat ini": "Current admin PIN", "PIN baru": "New PIN", "PIN baru (angka, 8 sampai 12 digit)": "New PIN (digits, 8 to 12)", "PIN baru berlaku di semua browser dan perangkat.": "The new PIN works in all browsers and devices.", "PIN baru harus angka 8 sampai 12 digit.": "The new PIN must be 8 to 12 digits.", "PIN guru": "Teacher PIN", "PIN harus angka 8 sampai 12 digit.": "The PIN must be 8 to 12 digits.", "PIN ini mudah ditebak. Ganti dengan angka 8 sampai 12 digit sebelum asesmen dimulai.": "This PIN is easy to guess. Change it to 8 to 12 digits before the assessment starts.", "PIN itu sudah dipakai guru lain.": "That PIN is already used by another teacher.", "PIN salah.": "Wrong PIN.", "PIN untuk": "PIN for", "Ping antar laptop berhasil": "Ping between laptops succeeds", "Ping dari dekat ke jauh: gateway dulu, lalu perangkat di subnet lain. Pakai tracert untuk melihat jalur.": "Ping from near to far: the gateway first, then devices in other subnets. Use tracert to see the path.", "Ping dari satu PC ke PC lain berhasil": "Ping from one PC to another succeeds", "Ping PC0 ke PC1 berhasil": "Ping from PC0 to PC1 succeeds", "Pisahkan jaringan dengan VLAN": "Separate networks with VLANs", "Port access hanya membawa satu VLAN. Port trunk membawa banyak VLAN antar-switch atau ke router. Native VLAN lewat tanpa tag (harus sama di kedua ujung). Allowed VLAN: isi mis. 10,20,30-40 atau all. VLAN yang belum ada dibuat otomatis.": "An access port carries only one VLAN. A trunk port carries many VLANs between switches or to a router. The native VLAN passes untagged (must be the same at both ends). Allowed VLAN: fill in e.g. 10,20,30-40 or all. Missing VLANs are created automatically.", "Port antar-switch dan port ke router berstatus trunk": "Inter-switch ports and the port to the router are trunks", "Port tidak ada.": "Port does not exist.", "port tidak shutdown, VLAN sesuai.": "port not shut down, VLAN matches.", "Port trunk membawa frame banyak VLAN dengan tag 802.1Q. Native VLAN lewat tanpa tag dan harus sama di kedua ujung. Daftar allowed VLAN membatasi VLAN yang boleh lewat.": "A trunk port carries frames of many VLANs with 802.1Q tags. The native VLAN passes untagged and must be the same at both ends. The allowed VLAN list limits which VLANs may pass.", "Printer jaringan. Perlu IP agar bisa dicetak dari banyak komputer.": "Network printer. Needs an IP so it can be printed to from many computers.", "Prompt akan berubah menjadi SW-LAB(config)#.": "The prompt will change to SW-LAB(config)#.", "Proyek dimuat dari berkas.": "Project loaded from file.", "Pustaka 3D belum termuat. Periksa koneksi internet lalu muat ulang halaman.": "The 3D library has not loaded. Check your internet connection and reload the page.", "Rancang jaringan lab komputer": "Design a computer lab network", "Rancang rencana IP dulu (tab Alur kerja). Gunakan satu atau dua subnet.": "Design the IP plan first (Workflow tab). Use one or two subnets.", "Rancang sendiri jaringan lab: satu router, dua switch, enam PC, dan satu server. Semua PC harus bisa mengakses server.": "Design a lab network yourself: one router, two switches, six PCs and one server. All PCs must be able to reach the server.", "Rancang, kabel, konfigurasi, uji ping": "Design, cable, configure, ping test", "Rancang: kebutuhan perangkat": "Design: device requirements", "Rancang: topologi dan jenis kabel": "Design: topology and cable types", "Rancang: tujuan jaringan": "Design: network goals", "Rapikan ke grid": "Snap to grid", "Reload simulasi: konfigurasi yang belum disimpan tetap dipertahankan di simulator ini.": "Reload simulation: unsaved configuration is kept in this simulator.", "Reset untuk murid berikutnya": "Reset for the next student", "Respons basis data tidak valid. Periksa alamat dan kunci basis data.": "Invalid database response. Check the database address and key.", "Rincian nilai otomatis": "Automatic score breakdown", "Ringkasan nilai": "Score summary", "RIP aktif di ketiga router": "RIP is active on all three routers", "RIP membuat router saling bertukar daftar jaringan. Versi 2 membawa mask. Auto-summary meringkas ke batas kelas dan bisa merusak jaringan yang terpisah, sehingga dimatikan.": "RIP makes routers exchange lists of networks. Version 2 carries the mask. Auto-summary summarizes at the class boundary and can break discontiguous networks, so it is turned off.", "RIP membuat router saling mengumumkan jaringan yang mereka kenal. Metrik adalah jumlah hop (maksimal 15). Distance statis 1 lebih diutamakan daripada RIP (120).": "RIP makes routers announce the networks they know to each other. The metric is hop count (maximum 15). Static distance 1 is preferred over RIP (120).", "RIP versi 2 dan no auto-summary di semua router": "RIP version 2 and no auto-summary on all routers", "RIP versi 2 dan no auto-summary. Kedua LAN sama-sama berawalan 10.x dan dipisahkan jaringan 192.168, sehingga auto-summary membuat rute bentrok.": "RIP version 2 and no auto-summary. Both LANs start with 10.x and are separated by the 192.168 network, so auto-summary makes the routes collide.", "Router dan PC sama-sama perangkat ujung (Layer 3), perlu crossover.": "Router and PC are both end devices (Layer 3), so they need crossover.", "Router dan router sejenis, jadi crossover.": "Router and router are like devices, so crossover.", "Router hanya tahu jaringan yang terhubung langsung. Jaringan lain harus diberi tahu lewat rute statis, di kedua arah.": "A router only knows directly connected networks. Other networks must be told through static routes, in both directions.", "Router ke router dan PC ke router sama-sama sejenis, jadi Crossover.": "Router to router and PC to router are both like devices, so Crossover.", "Router ke router dengan crossover (2 link)": "Router to router with crossover (2 links)", "Router memakai subinterface dengan encapsulation dot1q 10 dan 20.": "The router uses subinterfaces with dot1q encapsulation 10 and 20.", "Router menghubungkan subnet berbeda. PC memakai gateway untuk keluar dari subnetnya.": "The router connects different subnets. A PC uses the gateway to leave its subnet.", "Router otomatis mengenal jaringan yang terhubung langsung (C). Jaringan lain dibuat manual dengan rute statis, dan harus dibuat di": "A router automatically knows directly connected networks (C). Other networks are made manually with static routes, and must be created on", "router rip, version 2, network (jaringan yang terhubung), no auto-summary, passive-interface pada LAN.": "router rip, version 2, network (the connected networks), no auto-summary, passive-interface on the LANs.", "Router tab Konfigurasi atau CLI. Ingat no shutdown pada setiap interface.": "Router Config tab or CLI. Remember no shutdown on every interface.", "Router tab Konfigurasi, kartu Subinterface. Atau CLI: interface gi0/0.10, encapsulation dot1q 10, ip address 192.168.10.1 255.255.255.0.": "Router Config tab, Subinterface card. Or CLI: interface gi0/0.10, encapsulation dot1q 10, ip address 192.168.10.1 255.255.255.0.", "Router, switch, 2 PC, 1 server. Semua sudah dikonfigurasi dan siap di-ping.": "Router, switch, 2 PCs, 1 server. Everything is configured and ready to ping.", "Router0 Gi0/0 ke switch, Gi0/1 ke Router1 Gi0/0. Router1 Gi0/1 ke Router2 Gi0/1. Router2 Gi0/0 ke switch.": "Router0 Gi0/0 to the switch, Gi0/1 to Router1 Gi0/0. Router1 Gi0/1 to Router2 Gi0/1. Router2 Gi0/0 to the switch.", "Router: dua interface aktif, IP .1 pada": "Router: two interfaces up, IP .1 on", "Router: subinterface dot1q 10 dan 20 dengan IP gateway": "Router: dot1q 10 and 20 subinterfaces with gateway IPs", "Routing Dinamis RIP Tiga Router": "Dynamic Routing RIP Three Routers", "Ruang pantau dan basis data": "Monitoring room and database", "salah jenis.": "wrong type.", "Salin ke papan klip": "Copy to clipboard", "Salin seluruh teks, atau salin bagian skrip CLI saja untuk ditempel di CLI Packet Tracer.": "Copy all the text, or copy only the CLI script part to paste var keys=Object.keys(EN);
function rx(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
var FORCE={'Putih-oranye':1,'Putih-hijau':1,'Putih-biru':1,'Putih-cokelat':1,'Oranye':1,'Biru':1,'Hijau':1,'Cokelat':1,'Bantuan:':1,' dari ':1,' · otomatis':1,' · manual':1,'satu ujung T568B, ujung lain T568A':1,'Pemula':1,'Menengah':1,'Mahir':1,'Tab melengkapi':1,'ping gateway dulu.':1};
var sub=keys.filter(function(k){return FORCE[k]||(k.length>=8&&/\s/.test(k))}).sort(function(a,b){return b.length-a.length});
var re=null;
try{re=new RegExp('('+sub.map(rx).join('|')+')','g')}catch(x){re=null}
var cache=new Map();
function tr(s){
  if(LANG!=='en'||s==null)return s;
  s=String(s);
  if(s.length<2)return s;
  var c=cache.get(s);if(c!==undefined)return c;
  var m=/^(\s*)([\s\S]*?)(\s*)$/.exec(s),core=m[2],out;
  if(core&&Object.prototype.hasOwnProperty.call(EN,core))out=m[1]+EN[core]+m[3];
  else if(re&&core.length>=8)out=s.replace(re,function(k){return EN[k]});
  else out=s;
  if(cache.size>6000)cache.clear();
  cache.set(s,out);return out;
}
window.tr=tr;
window.getLang=function(){return LANG};
var ATTR=['placeholder','title','aria-label','alt'];
var ORIG=new WeakMap(),ORIGA=new WeakMap();
var SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,NOSCRIPT:1};
function txt(n){
  var p=n.parentNode;if(!p||SKIP[p.nodeName])return;
  var s=n.nodeValue;if(!s||s.length<2||!/[A-Za-z]/.test(s))return;
  var r=tr(s);if(r!==s){ORIG.set(n,s);n.nodeValue=r}
}
function attrs(el){
  for(var i=0;i<ATTR.length;i++){
    var a=ATTR[i];if(!el.hasAttribute||!el.hasAttribute(a))continue;
    var v=el.getAttribute(a),r=tr(v);
    if(r!==v){var o=ORIGA.get(el);if(!o){o={};ORIGA.set(el,o)}o[a]=v;el.setAttribute(a,r)}
  }
}
function walk(root){
  if(!root)return;
  if(root.nodeType===3){txt(root);return}
  if(root.nodeType!==1)return;
  attrs(root);
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,null),n;
  while((n=w.nextNode())){if(n.nodeType===3)txt(n);else attrs(n)}
}
function restore(root){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,null),n;
  while((n=w.nextNode())){
    if(n.nodeType===3){if(ORIG.has(n)){n.nodeValue=ORIG.get(n);ORIG.delete(n)}}
    else{var o=ORIGA.get(n);if(o){for(var a in o)n.setAttribute(a,o[a]);ORIGA.delete(n)}}
  }
}
var mo=null,busy=false;
function onMut(recs){
  if(busy||LANG!=='en')return;
  busy=true;mo.disconnect();
  try{
    for(var i=0;i<recs.length;i++){
      var r=recs[i];
      if(r.type==='childList'){for(var j=0;j<r.addedNodes.length;j++)walk(r.addedNodes[j])}
      else if(r.type==='characterData')txt(r.target);
      else if(r.type==='attributes')attrs(r.target);
    }
  }finally{busy=false;observe()}
}
function observe(){
  if(!mo)mo=new MutationObserver(onMut);
  mo.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTR});
}
var TITLE_ID=document.title;
function btnLabels(){
  var lbl=LANG==='en'?'ID':'EN';

  for(var i=0;i<els.length;i++)els[i].textContent=lbl;

    observe();
  }else{
    if(mo)mo.disconnect();
    restore(document.body);document.title=TITLE_ID;
  }

}
