    default:{
      add(cyl(0.6,0.6,0.14,HW.body,0,0.07,0,32),cyl(0.35,0.5,0.14,HW.mid,0,0.21,0,32));
      for(let i=0;i<3;i++){const t=new THREE.Mesh(new THREE.TorusGeometry(0.5+i*0.3,0.025,6,36),mat(on?0x7a5ad0:0x59606b));t.rotation.x=Math.PI/2;t.position.y=0.55+i*0.25;t.scale.set(1,1,1);if(!on)t.visible=false;add(t)}
    }
  }
  return g;
}
function labelSprite(text,sub){
  const key=text+'|'+sub+'|'+cssv('--ink')+'|'+cssv('--stage');
  let tex=V3.labelCache[key];
  if(!tex){
    const c=document.createElement('canvas');c.width=512;c.height=sub?128:80;const x=c.getContext('2d');
    x.font='600 38px Inter,system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';
    x.lineJoin='round';x.lineWidth=9;x.strokeStyle=cssv('--stage');x.strokeText(text,256,sub?36:40);x.fillStyle=cssv('--ink');x.fillText(text,256,sub?36:40);
    if(sub){x.font='500 30px JetBrains Mono,ui-monospace,monospace';x.strokeText(sub,256,92);x.fillStyle=cssv('--muted');x.fillText(sub,256,92)}
    tex=new THREE.CanvasTexture(c);V3.labelCache[key]=tex;
  }
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  const h=sub?0.8:0.5;sp.scale.set(3.2,h*1,1);sp.renderOrder=10;return sp;
}
function disposeGroup(g){
  for(let i=g.children.length-1;i>=0;i--){
    const c=g.children[i];disposeGroup(c);
    if(c.geometry)c.geometry.dispose();
    if(c.material){if(c.material.map&&false)c.material.map.dispose();c.material.dispose()}
    g.remove(c);
  }
}
function cableColor(l,st){
  if(st==='unplugged')return cssv('--c-off');
  return cssv(CAB_CSS[l.cable]);
}
function sync3D(){
  if(!V3.ok)return;
  const stage=cssv('--stage');
  V3.scene.background=new THREE.Color(stage);
  V3.ground.material.color=new THREE.Color(cssv('--surface2'));
  const dotc=new THREE.Color(cssv('--dot'));
  V3.grid.material.color=dotc;
  if(V3.grid.material.vertexColors){V3.grid.material.vertexColors=false;V3.grid.material.needsUpdate=true}
  disposeGroup(V3.root);
  const pos=id=>{const d=dev(id);return new THREE.Vector3(d.x/U3,0,d.y/U3)};
  for(const d of S.devices){
    const g=model(d);g.position.copy(pos(d.id));g.userData.dev=d.id;
    g.traverse(o=>{o.userData.dev=d.id});
    const lbl=labelSprite(d.name,subLabel(d));lbl.position.set(0,d.type==='server'?2.35:1.9,0);g.add(lbl);
    if(UI.sel&&UI.sel.kind==='dev'&&UI.sel.id===d.id){
      const ring=new THREE.Mesh(new THREE.RingGeometry(1.15,1.3,48),new THREE.MeshBasicMaterial({color:new THREE.Color(cssv('--accent')),side:THREE.DoubleSide}));
      ring.rotation.x=-Math.PI/2;ring.position.y=0.03;g.add(ring);
    }
    if(UI.linkFrom&&UI.linkFrom.dev===d.id||UI.pduFrom===d.id){
      const ring=new THREE.Mesh(new THREE.RingGeometry(1.15,1.3,48),new THREE.MeshBasicMaterial({color:new THREE.Color(cssv('--warn')),side:THREE.DoubleSide}));
      ring.rotation.x=-Math.PI/2;ring.position.y=0.03;g.add(ring);
    }
    V3.root.add(g);
  }
  for(const l of S.links){
    const a=dev(l.a.dev),b=dev(l.b.dev);if(!a||!b)continue;
    const st=linkState(l),A=pos(a.id),B=pos(b.id),dir=B.clone().sub(A);const len=dir.length()||1;dir.normalize();
    const col=new THREE.Color(cableColor(l,st)),sel=UI.sel&&UI.sel.kind==='link'&&UI.sel.id===l.id;
    const ledc=new THREE.Color(st==='up'?cssv('--good'):(st==='unplugged'?cssv('--c-off'):cssv('--bad')));
    const off=1.0;
    const a1=A.clone().addScaledVector(dir,off),b1=B.clone().addScaledVector(dir,-off);a1.y=0.2;b1.y=0.2;
    const group=new THREE.Group();group.userData.link=l.id;
    const mk=(p0,p1,radius,color,lift)=>{
      const mid=p0.clone().lerp(p1,0.5);mid.y=lift;
      const curve=new THREE.CatmullRomCurve3([p0,mid,p1]);
      const m=new THREE.Mesh(new THREE.TubeGeometry(curve,24,radius,8,false),new THREE.MeshLambertMaterial({color}));
      m.userData.link=l.id;group.add(m);
    };
    if(l.cable==='wifi'){
      const pts=[];for(let i=0;i<=24;i++){const t=i/24;const p=a1.clone().lerp(b1,t);p.y=0.5+Math.sin(t*Math.PI)*0.9;pts.push(p)}
      const geo=new THREE.BufferGeometry().setFromPoints(pts);
      const ln=new THREE.Line(geo,new THREE.LineDashedMaterial({color:st==='up'?col:new THREE.Color(cssv('--c-off')),dashSize:0.25,gapSize:0.2}));
      ln.computeLineDistances();ln.userData.link=l.id;group.add(ln);
      const hit=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),24,0.22,4,false),new THREE.MeshBasicMaterial({visible:false}));hit.userData.link=l.id;group.add(hit);
    }else{
      const r=(l.cable==='fiber'?0.03:0.055)*(sel?1.7:1);
      if(st==='unplugged'){
        const m1=a1.clone().lerp(b1,0.32),m2=a1.clone().lerp(b1,0.68);
        mk(a1,m1,r,col,0.2);mk(b1,m2,r,col,0.2);
        const plug=box(0.16,0.1,0.16,0x59606b,m1.x,0.12,m1.z);plug.userData.link=l.id;group.add(plug);
      }else{
        mk(a1,b1,r,col,Math.min(0.2+len*0.08,0.9));
      }
      for(const[p,sgn]of[[a1,1],[b1,-1]]){
        const plug=box(0.2,0.14,0.2,0x1c232d,p.x,0.2,p.z);plug.userData.link=l.id;group.add(plug);
        const led=new THREE.Mesh(new THREE.SphereGeometry(0.1,12,12),new THREE.MeshBasicMaterial({color:ledc}));led.position.set(p.x,0.42,p.z);led.userData.link=l.id;group.add(led);
      }
    }
    V3.root.add(group);
  }
  V3.dirty=true;
}
function start3D(){V3.running=true;resize3D();placeCam();V3.dirty=true;(function loop(){if(!V3.running)return;if(V3.dirty||V3.anim){V3.r.render(V3.scene,V3.cam);V3.dirty=false}requestAnimationFrame(loop)})()}
function stop3D(){V3.running=false}
/* ---------- picking dan gerak kamera ---------- */
function pick3D(e){
  const r=V3.r.domElement.getBoundingClientRect();
  const ndc=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  V3.ray.setFromCamera(ndc,V3.cam);
  const hits=V3.ray.intersectObjects(V3.root.children,true);
  for(const h of hits){
    let o=h.object;
    while(o){
      if(o.userData&&o.userData.dev)return{devId:o.userData.dev};
      if(o.userData&&o.userData.link)return{linkId:o.userData.link};
      o=o.parent;
    }
  }
  return{};
}
function groundPoint(e){
  const r=V3.r.domElement.getBoundingClientRect();
  const ndc=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  V3.ray.setFromCamera(ndc,V3.cam);
  const p=new THREE.Vector3();return V3.ray.ray.intersectPlane(V3.plane,p)?p:null;
}
function p3down(e){
  hidePopIfOutside(e);
  V3.r.domElement.setPointerCapture(e.pointerId);
  V3.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(V3.ptrs.size>1){V3.drag=null;V3.pinch={d:pinchDist(),rad:V3.rad};return}
  const hit=pick3D(e);
  const dd={sx:e.clientX,sy:e.clientY,moved:false,id:e.pointerId,devId:hit.devId||null,linkId:hit.linkId||null,th:V3.th,ph:V3.ph,pan:e.button===2||e.shiftKey,tx:V3.tgt.x,tz:V3.tgt.z};
  if(hit.devId&&UI.tool==='select'){const d=dev(hit.devId);dd.kind='dev';dd.ox=d.x;dd.oy=d.y;dd.pushed=false;dd.gp=groundPoint(e);select('dev',d.id)}
  else dd.kind=dd.pan?'pan':'orbit';
  V3.drag=dd;
}
function pinchDist(){const p=[...V3.ptrs.values()];if(p.length<2)return 1;return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1}
function p3move(e){
  if(V3.ptrs.has(e.pointerId))V3.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(V3.ptrs.size>1&&V3.pinch){V3.rad=clamp(V3.pinch.rad*V3.pinch.d/pinchDist(),5,140);placeCam();return}
  const dd=V3.drag;if(!dd||dd.id!==e.pointerId)return;
  const dx=e.clientX-dd.sx,dy=e.clientY-dd.sy;
  if(!dd.moved&&Math.hypot(dx,dy)>4){dd.moved=true;if(dd.kind==='dev'&&!dd.pushed){pushUndo();dd.pushed=true}}
  if(!dd.moved)return;
  if(dd.kind==='dev'){
    const p=groundPoint(e);if(!p||!dd.gp)return;
    const d=dev(dd.devId);let x=dd.ox+(p.x-dd.gp.x)*U3,y=dd.oy+(p.z-dd.gp.z)*U3;
    if(S.settings.snap){x=Math.round(x/25)*25;y=Math.round(y/25)*25}
    d.x=x;d.y=y;sync3D();
  }else if(dd.kind==='orbit'){
    V3.th=dd.th-dx*0.008;V3.ph=clamp(dd.ph-dy*0.008,0.15,1.5);placeCam();
  }else{
    const k=V3.rad*0.0016,s=Math.sin(V3.th),c=Math.cos(V3.th);
    V3.tgt.x=dd.tx-(dx*c+dy*s)*k;V3.tgt.z=dd.tz+(dx*s-dy*c)*k;placeCam();
  }
}
function p3up(e){
  V3.ptrs.delete(e.pointerId);
  if(V3.ptrs.size<2)V3.pinch=null;
  const dd=V3.drag;if(!dd||dd.id!==e.pointerId)return;V3.drag=null;
  if(dd.moved){if(dd.kind==='dev')afterChange();return}
  tap(dd,e.clientX,e.clientY);
}
/* ---------- animasi paket ---------- */
function animate3D(ids,ok){
  if(!V3.ok)return;
  const pts=ids.map(i=>dev(i)).filter(Boolean).map(d=>new THREE.Vector3(d.x/U3,0.9,d.y/U3));
  disposeGroup(V3.fx);V3.anim=null;
  if(pts.length<2)return;
  const ball=new THREE.Mesh(new THREE.SphereGeometry(0.28,16,16),new THREE.MeshBasicMaterial({color:new THREE.Color(ok?cssv('--good'):cssv('--accent'))}));
  V3.fx.add(ball);
  const segs=[];let total=0;for(let i=1;i<pts.length;i++){const l=pts[i].distanceTo(pts[i-1]);segs.push(l);total+=l}
  const t0=performance.now(),speed=7;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step=now=>{
    const dist=reduce?total:Math.min(total,(now-t0)/1000*speed);let acc=0;
    for(let i=0;i<segs.length;i++){if(dist<=acc+segs[i]||i===segs.length-1){const f=segs[i]?Math.min(1,(dist-acc)/segs[i]):1;ball.position.copy(pts[i]).lerp(pts[i+1],f);break}acc+=segs[i]}
    V3.dirty=true;
    if(dist<total){V3.anim=requestAnimationFrame(step)}else{V3.anim=null;setTimeout(()=>{disposeGroup(V3.fx);V3.dirty=true},1200)}
  };
  V3.anim=requestAnimationFrame(step);
}
/* ================= INISIALISASI ================= */
function boot(){
  buildPalette();bindCanvas();bindModal();bindGlobal();bindPanelExtras();
  loadProfile();
  let loaded=false;
  try{loaded=loadLocal()}catch(e){}
  if(!loaded||!S.devices.length){loadTemplate('lan',true)}
  if(typeof asesInit==='function')asesInit();
  if(typeof cbtInit==='function')cbtInit();
  markTabs();markPalette();setTool('select');
  afterChange();
  requestAnimationFrame(()=>requestAnimationFrame(fitView));
  window.addEventListener('resize',()=>{if(UI.view==='2d')render2D()});
}
boot();
